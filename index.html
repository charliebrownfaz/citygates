<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop Live Departures</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            font-size: 2.5vw;
            color: #aaaaaa;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-clock {
            color: #ff9900;
            font-weight: bold;
            font-size: 3.5vw;
        }
        .timetable {
            width: 100%;
            border-collapse: collapse;
        }
        .timetable tr {
            border-bottom: 1px solid #222;
        }
        .timetable td {
            padding: 15px 0;
            font-size: 5.5vw;
            font-weight: bold;
        }
        .route {
            color: #ff9900;
            width: 20%;
        }
        .destination {
            color: #ffffff;
            width: 55%;
        }
        .countdown {
            color: #00ff00;
            text-align: right;
            width: 25%;
        }
        .loading {
            font-size: 3vw;
            color: #888;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Live Departures <span style="font-size: 1.5vw; color: #666; margin-left: 10px;">Stop: 6200246210</span></div>
        <div id="clock" class="live-clock">00:00:00</div>
    </div>

    <div id="display-area">
        <div class="loading">Connecting to live timetable...</div>
    </div>

    <script>
        // 1. Digital Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Fetch Live Times via Direct Scraper Proxy
        async function fetchBusTimes() {
            const targetStopUrl = 'https://lthn.co';
            // Utilizing a clean proxy to fetch the raw webpage contents directly
            const proxyUrl = `https://corsproxy.io{encodeURIComponent(targetStopUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error();
                const htmlText = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Find all data table rows or list items inside Lothian's template
                const rows = doc.querySelectorAll('.stop-timetable tr, .timetable tr, tr');
                let html = '<table class="timetable">';
                let itemsFound = 0;

                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length >= 2) {
                        const route = cells[0].textContent.trim();
                        const dest = cells[1].textContent.trim();
                        const time = cells[2] ? cells[2].textContent.trim() : 'DUE';
                        
                        // Verify we are capturing real bus lines (e.g. alphanumeric strings)
                        if (route.length > 0 && route.length < 5) {
                            html += `<tr><td class="route">${route}</td><td class="destination">${dest}</td><td class="countdown">${time}</td></tr>`;
                            itemsFound++;
                        }
                    }
                });

                html += '</table>';

                if (itemsFound > 0) {
                    document.getElementById('display-area').innerHTML = html;
                } else {
                    // Fallback to searching text lists if they aren't using tables on this specific path
                    parseFallbackList(doc);
                }

            } catch (e) {
                document.getElementById('display-area').innerHTML = `<div class="loading" style="color: #ff3333;">Offline. Reconnecting...</div>`;
            }
        }

        function parseFallbackList(doc) {
            const items = doc.querySelectorAll('li, div[class*="row"], [class*="service"]');
            let html = '<table class="timetable">';
            let itemsFound = 0;

            items.forEach(item => {
                const text = item.textContent.replace(/\s+/g, ' ').trim();
                // Extract items that resemble: "22 Gyle Centre DUE" or "30 Clovenstone 5 mins"
                if (text.match(/^\w?\d+\s+.*\s+(\d+|DUE)/i)) {
                    const parts = text.split(' ');
                    const route = parts[0];
                    const time = parts[parts.length - 1];
                    const dest = parts.slice(1, parts.length - 1).join(' ').replace(/mins?/i, '').trim();

                    html += `<tr><td class="route">${route}</td><td class="destination">${dest}</td><td class="countdown">${time.toLowerCase() === 'due' ? 'DUE' : time + ' mins'}</td></tr>`;
                    itemsFound++;
                }
            });

            html += '</table>';

            if (itemsFound > 0) {
                document.getElementById('display-area').innerHTML = html;
            } else {
                document.getElementById('display-area').innerHTML = `<div class="loading">No upcoming departures listed.</div>`;
            }
        }

        fetchBusTimes();
        setInterval(fetchBusTimes, 30000); // Check for real-time timetable adjustments every 30 seconds
    </script>
</body>
</html>
