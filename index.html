<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop Live Departures</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            font-size: 2.5vw;
            color: #aaaaaa;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-clock {
            color: #ff9900;
            font-weight: bold;
            font-size: 3.5vw;
        }
        .timetable {
            width: 100%;
            border-collapse: collapse;
        }
        .timetable tr {
            border-bottom: 1px solid #222;
        }
        .timetable td {
            padding: 15px 0;
            font-size: 5.5vw;
            font-weight: bold;
        }
        .route {
            color: #ff9900;
            width: 20%;
        }
        .destination {
            color: #ffffff;
            width: 55%;
        }
        .countdown {
            color: #00ff00;
            text-align: right;
            width: 25%;
        }
        .loading {
            font-size: 3vw;
            color: #888;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Live Departures <span style="font-size: 1.5vw; color: #666; margin-left: 10px;">Stop: 6200246210</span></div>
        <div id="clock" class="live-clock">00:00:00</div>
    </div>

    <div id="display-area">
        <div class="loading">Fetching live times...</div>
    </div>

    <script>
        const stopId = "6200246210";
        // Using corsproxy.io to safely bridge the data over to GitHub Pages
        const apiEndpoint = `https://corsproxy.io{stopId}`;

        // 1. Digital Clock Function
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('clock').textContent = timeString;
        }
        // Update the clock every single second
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Bus Timetable Data Functions
        async function updateTimetable() {
            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                renderData(data);
            } catch (error) {
                document.getElementById('display-area').innerHTML = 
                    `<div class="loading" style="color: #ff3333;">Connection error. Retrying...</div>`;
            }
        }

        function renderData(data) {
            if (!data.departures || data.departures.length === 0) {
                document.getElementById('display-area').innerHTML = 
                    `<div class="loading">No upcoming buses scheduled.</div>`;
                return;
            }

            let html = '<table class="timetable">';
            
            data.departures.forEach(bus => {
                let dueTime = bus.minutes_due === 0 ? "DUE" : `${bus.minutes_due} mins`;
                
                html += `
                    <tr>
                        <td class="route">${bus.line_name}</td>
                        <td class="destination">${bus.destination}</td>
                        <td class="countdown">${dueTime}</td>
                    </tr>
                `;
            });

            html += '</table>';
            document.getElementById('display-area').innerHTML = html;
        }

        updateTimetable();
        // Refresh transit data layout every 30 seconds
        setInterval(updateTimetable, 30000);
    </script>
</body>
</html>
