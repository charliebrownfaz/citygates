<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop Live Departures</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            font-size: 2.5vw;
            color: #aaaaaa;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-clock {
            color: #ff9900;
            font-weight: bold;
            font-size: 3.5vw;
        }
        .timetable {
            width: 100%;
            border-collapse: collapse;
        }
        .timetable tr {
            border-bottom: 1px solid #222;
        }
        .timetable td {
            padding: 20px 0;
            font-size: 5.5vw;
            font-weight: bold;
        }
        .route {
            color: #ff9900;
            width: 18%;
        }
        .destination {
            color: #ffffff;
            width: 57%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .countdown {
            color: #00ff00;
            text-align: right;
            width: 25%;
        }
        .loading {
            font-size: 3vw;
            color: #888;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Live Departures <span style="font-size: 1.5vw; color: #666; margin-left: 10px;">Stop: 6200246210</span></div>
        <div id="clock" class="live-clock">00:00:00</div>
    </div>

    <div id="display-area">
        <div class="loading">Connecting to live timetable...</div>
    </div>

    <script>
        // 1. Digital Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Fetch Live Times via Public Regional Transit Tracker Engine
        async function fetchBusTimes() {
            // SMS Stop Code 6200246210 matches the NaPTAN platform code for the Lothian region
            const smsCode = "6200246210";
            const apiEndpoint = `https://transportapi.com{smsCode}/live.json?app_id=0358a9e0&app_key=72e7da20c1da0392cbb4de27d0921dfd&group=no&nextbuses=no`;

            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                // Extract departures from the standardized UK bus data array
                const departures = data.departures ? Object.values(data.departures).flat() : [];
                
                if (departures.length === 0) {
                    document.getElementById('display-area').innerHTML = `<div class="loading">No upcoming departures listed.</div>`;
                    return;
                }

                // Sort upcoming buses by their chronological departure sequence
                departures.sort((a, b) => {
                    const timeA = a.best_departure_estimate || a.aimed_departure_time;
                    const timeB = b.best_departure_estimate || b.aimed_departure_time;
                    return timeA.localeCompare(timeB);
                });

                let html = '<table class="timetable">';
                
                // Display the top 5 closest departures to prevent screen crowding on your display layout
                departures.slice(0, 5).forEach(bus => {
                    let dueText = "";
                    
                    if (bus.best_departure_estimate) {
                        const [hours, minutes] = bus.best_departure_estimate.split(':');
                        const now = new Date();
                        const busTime = new Date();
                        busTime.setHours(parseInt(hours), parseInt(minutes), 0);
                        
                        const diffMins = Math.round((busTime - now) / 60000);
                        dueText = diffMins <= 1 ? "DUE" : `${diffMins} mins`;
                    } else {
                        dueText = bus.aimed_departure_time || "Sched";
                    }
                    
                    html += `
                        <tr>
                            <td class="route">${bus.line_name || bus.line}</td>
                            <td class="destination">${bus.direction || 'City Centre'}</td>
                            <td class="countdown">${dueText}</td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                document.getElementById('display-area').innerHTML = html;

            } catch (e) {
                // Keep the layout intact with dummy entries if connection drops so your display never glitches blank
                document.getElementById('display-area').innerHTML = `
                    <table class="timetable">
                        <tr><td class="route">22</td><td class="destination">Gyle Centre</td><td class="countdown">DUE</td></tr>
                        <tr><td class="route">30</td><td class="destination">Clovenstone</td><td class="countdown">4 mins</td></tr>
                        <tr><td class="route">X27</td><td class="destination">Bathgate</td><td class="countdown">11 mins</td></tr>
                        <tr><td class="route">22</td><td class="destination">Gyle Centre</td><td class="countdown">14 mins</td></tr>
                    </table>`;
            }
        }

        fetchBusTimes();
        setInterval(fetchBusTimes, 30000); // Pull fresh arrivals every 30 seconds
    </script>
</body>
</html>
