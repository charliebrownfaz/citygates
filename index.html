<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Stop Live Departures</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            font-size: 2.5vw;
            color: #aaaaaa;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-clock {
            color: #ff9900;
            font-weight: bold;
            font-size: 3.5vw;
        }
        .timetable {
            width: 100%;
            border-collapse: collapse;
        }
        .timetable tr {
            border-bottom: 1px solid #222;
        }
        .timetable td {
            padding: 15px 0;
            font-size: 5.5vw;
            font-weight: bold;
        }
        .route {
            color: #ff9900;
            width: 20%;
        }
        .destination {
            color: #ffffff;
            width: 55%;
        }
        .countdown {
            color: #00ff00;
            text-align: right;
            width: 25%;
        }
        .loading {
            font-size: 3vw;
            color: #888;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Live Departures <span style="font-size: 1.5vw; color: #666; margin-left: 10px;">Stop: 6200246210</span></div>
        <div id="clock" class="live-clock">00:00:00</div>
    </div>

    <div id="display-area">
        <div class="loading">Connecting to transit stream...</div>
    </div>

    <script>
        // 1. Digital Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Fetch Live Times via Open Mobile Endpoint
        async function fetchBusTimes() {
            // Using the open-access JSON payload route natively served by the transit system
            const apiEndpoint = 'https://buses.co.uk';

            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                if (!data || !data.services || data.services.length === 0) {
                    document.getElementById('display-area').innerHTML = `<div class="loading">No upcoming buses scheduled.</div>`;
                    return;
                }

                let html = '<table class="timetable">';
                let busCount = 0;

                // Loop through the data to structure the timetable rows
                data.services.forEach(service => {
                    service.departures.forEach(bus => {
                        busCount++;
                        let dueTime = bus.minutes === 0 ? "DUE" : `${bus.minutes} mins`;
                        html += `
                            <tr>
                                <td class="route">${service.service_number}</td>
                                <td class="destination">${bus.destination}</td>
                                <td class="countdown">${dueTime}</td>
                            </tr>
                        `;
                    });
                });

                html += '</table>';

                if (busCount > 0) {
                    document.getElementById('display-area').innerHTML = html;
                } else {
                    document.getElementById('display-area').innerHTML = `<div class="loading">No services scheduled right now.</div>`;
                }

            } catch (e) {
                // Connection failed layout block to protect the visual output from crashing
                document.getElementById('display-area').innerHTML = `<div class="loading" style="color: #ff3333;">Data stream error. Retrying...</div>`;
            }
        }

        fetchBusTimes();
        setInterval(fetchBusTimes, 30000); // Check for arrival changes every 30 seconds
    </script>
</body>
</html>
